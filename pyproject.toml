[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spanjudge"
version = "0.1.0"
description = "OTLP trace storage and regression gates for AI agents"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
spanjudge = "spanjudge.cli:main"

[tool.setuptools]
packages = ["spanjudge"]
